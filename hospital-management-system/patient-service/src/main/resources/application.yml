spring:
  application:
    name: patient-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8083/auth-service}/.well-known/jwks.json

  datasource:
    url: jdbc:mysql://localhost:3309/patientdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: AmDee
    password: AmDee

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

server:
  port: 8081
  servlet:
    context-path: /patient-service

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hospital.patient: DEBUG
    org.springframework.security: INFO
    org.springframework.web: DEBUG
    root: INFO

# ========== DOCKER PROFILE ==========
---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mysql://mysql-patient:3306/patientdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: AmDee
    password: AmDee

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin123

server:
  port: 8081

logging:
  level:
    com.hospital.patient: INFO
    org.springframework.security: INFO
    root: INFO

# ========== PROD PROFILE ==========
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql-patient:3306/patientdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: ${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DATABASE_USERNAME:AmDee}
    password: ${DATABASE_PASSWORD:AmDee}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin123

server:
  port: 8081

logging:
  level:
    com.hospital.patient: INFO
    org.springframework.security: WARN
    root: WARN
