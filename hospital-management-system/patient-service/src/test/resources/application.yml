server:
  port: 8081
  servlet:
    context-path: /patient-service

spring:
  application:
    name: patient-service
  profiles:
    active: default

security:
  oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: http://localhost:9000/.well-known/jwks.json
  datasource:
    # Use file-based H2 even for default profile to persist data
    url: jdbc:h2:file:./data/patientdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: AmDee
    password: AmDee

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Change to validate - let Flyway handle schema changes
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true

logging:
  level:
    com.hospital.patient: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: INFO
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: docker

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:9000/.well-known/jwks.json

  datasource:
    url: jdbc:h2:file:/app/data/patientdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: AmDee
    password: AmDee

  jpa:
    hibernate:
      ddl-auto: validate  # Let Flyway handle migrations
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: false

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}

logging:
  level:
    com.hospital.patient: ${LOGGING_LEVEL_COM_HOSPITAL_PATIENT:INFO}
    org.springframework.web: INFO
    org.flywaydb: INFO
    root: INFO