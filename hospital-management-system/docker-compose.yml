
services:
  rabbitmq:
   image: rabbitmq:3-management
   container_name: hospital-rabbitmq
   ports:
     - "5672:5672"    # AMQP port
     - "15672:15672"  # Management UI port
   environment:
     RABBITMQ_DEFAULT_USER: admin
     RABBITMQ_DEFAULT_PASS: admin123

  employee-service:
    build:
      context: .
      dockerfile: employee-service/Dockerfile.employee-service
    container_name: employee-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - hospital-network

  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile.patient-service
    container_name: patient-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - hospital-network

  employee-frontend:
     build:
       context: ./Front/employee-front
       dockerfile: Dockerfile.employee-front
     container_name: employee-frontend-dev
     ports:
       - "4200:4200"
       - "49153:49153"  # For live reload
     volumes:
# Mount source code for hot reload (excluding node_modules)
       - ./Front/employee-front:/app
       - /app/node_modules
       - /app/dist
     environment:
       - NODE_ENV=development
       - NG_CLI_ANALYTICS=false
     networks:
       - hospital-network
     restart: unless-stopped
     stdin_open: true
     tty: true
    # Optional: depends on backend services
    # depends_on:
         #   - employee-backend

networks:
  hospital-network:
    driver: bridge	

volumes:
  rabbitmq_data:
