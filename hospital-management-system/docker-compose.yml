
services:
  employee-service:
    build:
      context: ./employee_service
      dockerfile: Dockerfile.employee-service
    container_name: employee-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - hospital-network

  patient-service:
    build:
      context: ./patient_service
      dockerfile: Dockerfile.patient-service
    container_name: patient-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - hospital-network

  employee-frontend:
    build:
      context: ./Front/front/employee-front
      dockerfile: Dockerfile.employee-front
    container_name: employee-frontend
    ports:
      - "4200:80"
    depends_on:
      - employee-service
      - patient-service
    networks:
      - hospital-network

networks:
  hospital-network:
    driver: bridge
