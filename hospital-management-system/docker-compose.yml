
services:
  rabbitmq:
   image: rabbitmq:3-management
   container_name: hospital-rabbitmq
   ports:
     - "5672:5672"    # AMQP port
     - "15672:15672"  # Management UI port
   environment:
     RABBITMQ_DEFAULT_USER: admin
     RABBITMQ_DEFAULT_PASS: admin123

  employee-service:
    build:
      context: .
      dockerfile: employee-service/Dockerfile.employee-service
    container_name: employee-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - hospital-network

  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile.patient-service
    container_name: patient-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - hospital-network

  employee-frontend:
    build:
      context: ./Front/front/employee-front
      dockerfile: Dockerfile.employee-front
    container_name: employee-frontend
    ports:
      - "4200:80"
    depends_on:
      - employee-service
      - patient-service
    networks:
      - hospital-network

networks:
  hospital-network:
    driver: bridge	

volumes:
  rabbitmq_data:
