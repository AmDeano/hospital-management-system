spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: AmDee
    password: AmDee

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  rabbitmq:   # ✅ must be under spring
    host: localhost
    port: 5672
    username: admin
    password: admin123


server:
  port: 8083
  servlet:
    context-path: /auth-service

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hospital.auth: DEBUG
    org.springframework.security: INFO
    org.springframework.web: DEBUG
    root: INFO

# JWT Configuration
jwt:
  expiration: 900000  # 15 minutes in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# CORS Configuration
app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:3000
  # Data Initialization - default credentials (development only)
  init:
    enabled: true
    admin-password: ${ADMIN_PASSWORD:admin@123}
    hr-password: ${HR_PASSWORD:hr@123}

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mysql://mysql-auth:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: AmDee
    password: AmDee

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:   # ✅ must be under spring
    host: rabbitmq
    port: 5672
    username: admin
    password: admin123

server:
  port: 8083

logging:
  level:
    com.hospital.auth: INFO
    org.springframework.security: INFO
    root: INFO

# CORS Configuration (Docker)
app:
  cors:
    allowed-origins: http://employee-front:4200,http://localhost:4200
  # Data Initialization (Docker)
  init:
    enabled: true
    admin-password: ${ADMIN_PASSWORD:admin@123}
    hr-password: ${HR_PASSWORD:hr@123}

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://mysql-auth:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: AmDee
    password: AmDee

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  rabbitmq:   # ✅ must be under spring
    host: rabbitmq
    port: 5672
    username: admin
    password: admin123
server:
  port: 8083

logging:
  level:
    com.hospital.auth: INFO
    org.springframework.security: WARN
    root: WARN

# CORS Configuration (Production)
app:
  cors:
    allowed-origins: https://app.hospital.com,https://admin.hospital.com
  # Data Initialization (Production - DISABLED by default, requires environment variables)
  init:
    enabled: false
    admin-password: ${ADMIN_PASSWORD}
    hr-password: ${HR_PASSWORD}