spring:
  application:
    name: employee-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:8083/auth-service/.well-known/jwks.json

  datasource:
    url: jdbc:mysql://localhost:3308/employeedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: AmDee
    password: AmDee

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8082
  servlet:
    context-path: /employee-service

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hospital.employee: DEBUG
    org.springframework.security: INFO
    org.springframework.web: DEBUG
    root: INFO

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mysql://mysql-employee:3306/employeedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: AmDee
    password: AmDee

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082

logging:
  level:
    com.hospital.employee: INFO
    org.springframework.security: INFO
    root: INFO

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql-employee:3306/employeedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: ${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DATABASE_USERNAME:AmDee}
    password: ${DATABASE_PASSWORD:AmDee}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8082

logging:
  level:
    com.hospital.employee: INFO
    org.springframework.security: WARN
    root: WARN
