server:
  port: 8082
  servlet:
    context-path: /employee-service

spring:
  application:
    name: employee-service
  profiles:
    active: default
  
  datasource:
    url: jdbc:h2:mem:employeedb
    driver-class-name: org.h2.Driver
    username: AmDee
    password: AmDee

  jpa:
    hibernate:
      ddl-auto: update # use 'create-drop' for fresh db on each run
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true  # Allow access from other containers

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hospital.employee: DEBUG
    org.springframework.web: DEBUG
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: docker
  
  datasource:
    # Use file-based H2 for persistence in Docker
    url: jdbc:h2:file:/app/data/employeedb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: Amdee
    password: AmDee

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

	rabbitmq:
		host: localhost
		port: 5672
		username: admin
		password: admin123
		virtual-host: /	
	
logging:
  level:
    com.hospital.employee: ${LOGGING_LEVEL_COM_HOSPITAL_EMPLOYEE:INFO}
    org.springframework.web: INFO
    root: INFO